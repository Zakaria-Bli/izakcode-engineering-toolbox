name: Documentation improvement
description: Suggest a documentation, principle, pattern, or decision-record improvement.
title: "docs(scope): "
labels: [docs]
body:
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Which document or area should change?
      placeholder: docs/principles/environment.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is unclear, missing, or outdated?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should be added, removed, or clarified?
    validations:
      required: true
