version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "@types/node"
        versions:
          - ">=25"
    groups:
      linting:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-*"
          - typescript-eslint
      formatting:
        patterns:
          - prettier
      testing:
        patterns:
          - vitest
          - "@vitest/*"
      git-hooks:
        patterns:
          - husky
          - lint-staged
          - "@commitlint/*"
      types:
        patterns:
          - "@types/*"
      typescript:
        patterns:
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
